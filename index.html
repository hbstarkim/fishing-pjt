<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b2545" />
  <title>안면도 쭈꾸미 원정대</title>
  <meta name="description" content="구매항 피싱게이트 바하호 쭈꾸미·갑오징어 낚시 1박 2일 일정" />
  <meta property="og:title" content="안면도 쭈꾸미 원정대 🦑" />
  <meta property="og:description" content="잠실 → 향남 → 행담도 → 안면도 구매항 · 바하호 선상낚시 1박 2일" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦑</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="hero">
    <div class="hero-inner">
      <p class="eyebrow">1박 2일 · 태안 안면도</p>
      <h1 id="trip-title">안면도 쭈꾸미 원정대</h1>
      <p id="trip-subtitle" class="subtitle"></p>
      <div class="hero-chips">
        <span class="chip" id="dday-chip">📅 날짜 미정</span>
        <span class="chip">🦑 쭈꾸미 · 갑오징어</span>
        <span class="chip">⛴ 13:00–18:00</span>
      </div>
    </div>
    <div class="waves" aria-hidden="true"></div>
  </header>

  <main>
    <section class="card map-card" aria-label="경로 지도">
      <div class="map-toolbar">
        <div class="seg" role="tablist" aria-label="일자 선택">
          <button class="seg-btn active" data-day="all" role="tab">전체</button>
          <button class="seg-btn" data-day="1" role="tab">1일차</button>
          <button class="seg-btn" data-day="2" role="tab">2일차</button>
          <button class="seg-btn" data-day="island" role="tab">안면도 🔍</button>
        </div>
        <button class="ghost-btn" id="locate-btn" title="내 위치">📍</button>
      </div>
      <div id="map" role="application" aria-label="여행 경로 지도"></div>
      <ul class="legend" id="legend"></ul>
      <div class="naver-routes" id="naver-routes"></div>
      <p class="map-note" id="map-note">경로선은 대략적인 이동 경로예요. 길찾기는 각 일정의 지도 버튼을 눌러주세요.</p>
    </section>

    <section class="card shots-card" id="route-shots" aria-label="네이버지도 경로 캡처" hidden>
      <h2>🧭 네이버지도 경로</h2>
      <div class="shots" id="shots"></div>
    </section>

    <section id="timeline" aria-label="시간대별 일정"></section>

    <section class="card checklist-card" aria-label="준비물">
      <h2>🎒 준비물 체크</h2>
      <ul id="checklist"></ul>
    </section>
  </main>

  <footer>
    <p>지도 © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors · 사진: Wikimedia Commons (각 사진 클릭 시 원본/라이선스)</p>
  </footer>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
